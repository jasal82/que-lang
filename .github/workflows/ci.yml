name: CI and release

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Run tests
        run: cargo +stable test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rust_targets: x86_64-unknown-linux-musl
            archive: que-x86_64-unknown-linux-musl.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            archive: que-x86_64-pc-windows-msvc.zip
          - os: macos-15-intel
            target: universal-apple-darwin
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            archive: que-universal-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          IFS=',' read -ra targets <<< "${{ matrix.rust_targets }}"
          for target in "${targets[@]}"; do
            rustup target add --toolchain stable "$target"
          done

      - name: Build release binaries
        if: matrix.target != 'universal-apple-darwin'
        shell: bash
        run: cargo +stable build --workspace --release --locked --target "${{ matrix.target }}"

      - name: Build universal macOS release binaries
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          IFS=',' read -ra targets <<< "${{ matrix.rust_targets }}"
          for target in "${targets[@]}"; do
            cargo +stable build --workspace --release --locked --target "$target"
          done

      - name: Package Linux release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          package="que-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/que" "dist/$package/"
          cp "target/${{ matrix.target }}/release/que-lsp" "dist/$package/"
          cp README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/${{ matrix.archive }}" "$package"

      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $package = "que-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/que.exe" "dist/$package/"
          Copy-Item "target/${{ matrix.target }}/release/que-lsp.exe" "dist/$package/"
          Copy-Item README.md, LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/${{ matrix.archive }}"

      - name: Package universal macOS release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'universal-apple-darwin'
        shell: bash
        run: |
          package="que-${{ matrix.target }}"
          mkdir -p "dist/$package"
          lipo -create \
            target/x86_64-apple-darwin/release/que \
            target/aarch64-apple-darwin/release/que \
            -output "dist/$package/que"
          lipo -create \
            target/x86_64-apple-darwin/release/que-lsp \
            target/aarch64-apple-darwin/release/que-lsp \
            -output "dist/$package/que-lsp"
          codesign --force --sign - "dist/$package/que"
          codesign --force --sign - "dist/$package/que-lsp"
          lipo -archs "dist/$package/que"
          lipo -archs "dist/$package/que-lsp"
          cp README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/${{ matrix.archive }}" "$package"

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - test
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
          fi
